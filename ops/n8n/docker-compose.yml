services:
  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:?set N8N_IMAGE_TAG to a pinned n8n version}
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      - N8N_HOST=${N8N_HOST:?set N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_EDITOR_BASE_URL=https://${N8N_HOST}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set a persistent secret}
      - N8N_BASIC_AUTH_ACTIVE=false
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Berlin}
      - TZ=${GENERIC_TIMEZONE:-Europe/Berlin}
    volumes:
      - n8n_data:/home/node/.n8n

  webhook-verifier:
    build:
      context: .
      dockerfile: webhook-verifier.Dockerfile
    image: study-app-webhook-verifier:kan-156
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?set the GitHub webhook secret}
      - GITHUB_EXPECTED_REPOSITORY=${GITHUB_EXPECTED_REPOSITORY:?set the trusted owner/repository}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/github-ci-to-jira
      - DELIVERY_STORE_DIR=/var/lib/webhook-verifier/deliveries
    volumes:
      - verifier_data:/var/lib/webhook-verifier
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - n8n

  ai-router:
    build:
      context: .
      dockerfile: ai-router.Dockerfile
    image: study-app-ai-router:kan-127
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - ROUTER_SHARED_SECRET=${ROUTER_SHARED_SECRET:?set the internal router secret}
      - ROUTER_STATE_PATH=/var/lib/ai-router/router-state.json
      - LLM_MONTHLY_BUDGET_EUR=20
      - LLM_BUDGET_WARNING_RATIO=0.8
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_MODEL_LEVEL=${LLM_MODEL_LEVEL:-luna}
      - LLM_INPUT_EUR_PER_MILLION_TOKENS=${LLM_INPUT_EUR_PER_MILLION_TOKENS:-}
      - LLM_OUTPUT_EUR_PER_MILLION_TOKENS=${LLM_OUTPUT_EUR_PER_MILLION_TOKENS:-}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-512}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-15000}
    volumes:
      - router_data:/var/lib/ai-router
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
      - webhook-verifier
    environment:
      - N8N_HOST=${N8N_HOST:?set N8N_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  verifier_data:
  router_data:
  caddy_data:
  caddy_config:
