name: Browser E2E Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      VITE_DEBUG_SYNC: 'false'
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required E2E secrets
        shell: bash
        run: |
          missing=0
          for key in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY E2E_TEST_EMAIL E2E_TEST_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required. Browser-E2E must not be silently skipped."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright for this CI run
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Unit and integration tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Start branch build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/study-app-preview.log 2>&1 &
          echo $! > /tmp/study-app-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/study-app-preview.log
          exit 1

      - name: Browser regression
        run: npx playwright test --project=chromium

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/study-app-preview.log
          if-no-files-found: ignore
          retention-days: 14
